<script type="module">
    // 1. استيراد المكتبات المطلوبة من النسخة الجديدة
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, collection, onSnapshot, query, orderBy, where, getDocs, addDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // 2. بيانات مشروع ZORIN STORE 2026 الجديد
        const firebaseConfig = {
            apiKey: "AIzaSyAxeYGtXRJLoKguWleXn89BAEMt7wLYAVY",
            authDomain: "zorin-store-2026.firebaseapp.com",
            projectId: "zorin-store-2026",
            storageBucket: "zorin-store-2026.firebasestorage.app",
            messagingSenderId: "272032162345",
            appId: "1:272032162345:web:b09eab937b053373ad7238"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let product = null;
        let selectedColor = "";
        let selectedSize = "";
        let quantity = 1;
        let maxAvailable = 0;
        let tempItem = null;
        let cart = JSON.parse(localStorage.getItem('zorin_cart')) || [];
        let currentUser = null;

        // --- [1] نظام المستخدم والطلبات والـ Sidebars ---
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            const navName = document.getElementById('navUserName');
            const visitorBox = document.getElementById('visitorNameBox');
            if (user) {
                const name = user.displayName || user.email.split('@')[0];
                if(navName) navName.innerText = name;
                document.getElementById('welcomeName').innerText = "Hi, " + name;
                document.getElementById('userEmailTxt').innerText = user.email;
                if(visitorBox) visitorBox.style.display = 'none';
                loadUserOrders(user.email);
            } else {
                if(navName) navName.innerText = "Login";
                if(visitorBox) visitorBox.style.display = 'block';
            }
        });

        async function loadUserOrders(userEmail) {
            const list = document.getElementById('ordersList');
            try {
                const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
                const snap = await getDocs(q);
                list.innerHTML = "";
                let found = 0;
                snap.forEach(doc => {
                    const order = doc.data();
                    const orderEmail = order.customer?.email || order.email;
                    if (orderEmail === userEmail) {
                        found++;
                        const date = order.createdAt?.toDate().toLocaleDateString('en-GB') || "Processing";
                        list.innerHTML += `
                        <div class="order-card" style="border-left: 4px solid #000;">
                            <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                                <b>ID: #${doc.id.slice(0, 8)}</b>
                                <span style="color:green; font-weight:bold;">${order.status || 'New'}</span>
                            </div>
                            <div style="font-size:11px;">📅 ${date} | 💰 ${order.total} EGP</div>
                        </div>`;
                    }
                });
                if (found === 0) list.innerHTML = `<p style="font-size:12px; color:#999; text-align:center">No orders found.</p>`;
            } catch (err) { console.error(err); }
        }

        // --- [2] نظام صفحة المنتج والمخزون ---
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        async function loadProduct() {
            if (!productId) return;
            const docRef = doc(db, "products", productId);
            const snap = await getDoc(docRef);
            if (snap.exists()) {
                product = { id: snap.id, ...snap.data() };
                renderProduct();
                loadReviews();
                loadRelatedProducts();
            }
        }

        function renderProduct() {
            document.getElementById('productName').innerText = product.name;
            document.getElementById('currentPrice').innerText = (product.salePrice || product.price) + " EGP";
            if (product.salePrice < product.price) document.getElementById('oldPrice').innerText = product.price + " EGP";
            document.getElementById('productDescContent').innerText = product.pDesc || "لا يوجد وصف";

            // السلايدر (Slider)
            const swiperWrapper = document.getElementById('swiperWrapper');
            if(swiperWrapper) {
                swiperWrapper.innerHTML = "";
                const imagesToDisplay = product.allImages && product.allImages.length > 0 ? product.allImages : [product.image];
                imagesToDisplay.forEach(imgUrl => {
                    swiperWrapper.innerHTML += `
                        <div class="swiper-slide">
                            <img src="${imgUrl}" style="width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 15px;">
                        </div>`;
                });

                new Swiper(".mySwiper", {
                    loop: true,
                    pagination: { el: ".swiper-pagination", clickable: true },
                    navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" },
                    grabCursor: true,
                });
            }

            const colorSelector = document.getElementById('colorSelector');
            colorSelector.innerHTML = "";
            product.variants.forEach((v, i) => {
                const btn = document.createElement('div');
                btn.className = 'tag';
                btn.innerText = v.color;
                btn.onclick = () => {
                    selectedColor = v.color;
                    document.querySelectorAll('#colorSelector .tag').forEach(t => t.classList.remove('active'));
                    btn.classList.add('active');
                    renderSizes(v.stock);
                };
                colorSelector.appendChild(btn);
                if (i === 0) btn.click();
            });
        }
async function loadRelatedProducts() {

    if (!product || !product.categories || product.categories.length === 0) return;

    const mainCategory = product.categories[0]; // أول كاتيجوري

    const q = query(
        collection(db, "products"),
        where("categories", "array-contains", mainCategory)
    );

    const snap = await getDocs(q);

    const container = document.getElementById("relatedProducts");
    if(!container) return;

    container.innerHTML = "";

    let count = 0;

    snap.forEach(docSnap => {

        if(docSnap.id === product.id) return; // يمنع المنتج الحالي

        if(count >= 4) return; // نعرض 4 بس

        const p = docSnap.data();

        const img = (p.allImages && p.allImages.length > 0) 
            ? p.allImages[0] 
            : p.image;

        container.innerHTML += `
            <div class="related-card"
                 onclick="location.href='product.html?id=${docSnap.id}'">

                <img src="${img}" alt="">

                <div class="info">
                    <h4>${p.name}</h4>
                    <span>${p.salePrice || p.price} EGP</span>
                </div>
            </div>
        `;

        count++;
    });
}

        function renderSizes(stock) {
            const sizeSelector = document.getElementById('sizeSelector');
            sizeSelector.innerHTML = '';
            selectedSize = "";
            maxAvailable = 0;
            quantity = 1;
            document.getElementById('qtyVal').innerText = "1";
            document.getElementById('stockNotice').innerText = "";

            ['M', 'L', 'XL', 'XXL'].forEach(s => {
                const tag = document.createElement('div');
                const avail = parseInt(stock[s]) || 0;
                tag.className = avail > 0 ? 'tag' : 'tag disabled';
                tag.innerText = s;
                if (avail > 0) {
                    tag.onclick = () => {
                        selectedSize = s;
                        maxAvailable = avail;
                        document.querySelectorAll('#sizeSelector .tag').forEach(t => t.classList.remove('active'));
                        tag.classList.add('active');
                        document.getElementById('stockNotice').innerText = `(المتاح: ${avail})`;
                    };
                }
                sizeSelector.appendChild(tag);
            });
        }

        // --- [3] العربة والدفع ---
        window.changeQty = (val) => {
            if (!selectedSize) { alert("اختر المقاس أولاً"); return; }
            if (quantity + val < 1) return;
            if (quantity + val > maxAvailable) { alert(`المتاح ${maxAvailable} فقط`); return; }
            quantity += val;
            document.getElementById('qtyVal').innerText = quantity;
        };

        window.addToCart = (showCart = true) => {
            if (!selectedSize) return alert("الرجاء اختيار المقاس");
            const item = {
                id: productId,
                name: product.name,
                price: product.salePrice || product.price,
                color: selectedColor,
                size: selectedSize,
                image: product.image,
                qty: quantity
            };
            cart.push(item);
            updateCart();
            if (showCart) toggleCart(true);
        };

        window.confirmOrder = async () => {
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const addr = document.getElementById('custAddress').value;
            if (!name || !phone || !addr) return alert("أكمل البيانات");

            let orderItems = tempItem ? [tempItem] : [...cart];
            if (orderItems.length === 0) return alert("لا توجد منتجات");

            const btn = document.getElementById('confirmBtn');
            btn.innerText = "جاري التأكيد..."; btn.disabled = true;

            try {
                await addDoc(collection(db, "orders"), {
                    customer: { name, phone, address: addr, email: currentUser?.email || "Guest" },
                    items: orderItems,
                    total: orderItems.reduce((sum, item) => sum + (Number(item.price) * Number(item.qty)), 0),
                    status: "new",
                    createdAt: new Date()
                });

                for (const item of orderItems) {
                    const productRef = doc(db, "products", item.id);
                    const pSnap = await getDoc(productRef);
                    if (pSnap.exists()) {
                        const pData = pSnap.data();
                        const updatedVariants = pData.variants.map(v => {
                            if (v.color === item.color && v.stock && item.size in v.stock) {
                                let currentStock = Number(v.stock[item.size]) || 0;
                                let orderedQty = Number(item.qty) || 1;
                                v.stock[item.size] = Math.max(0, currentStock - orderedQty);
                            }
                            return v;
                        });
                        await updateDoc(productRef, { variants: updatedVariants });
                    }
                }
                alert("تم استلام طلبك!");
                localStorage.removeItem('zorin_cart');
                location.href = "index.html";
            } catch (error) { 
                console.error(error); 
                alert("خطأ في الطلب"); 
                btn.innerText = "تأكيد الطلب"; btn.disabled = false; 
            }
        };

        // --- [4] وظائف الـ UI ---
        window.toggleSidebar = (id) => {
            document.getElementById(id).classList.add('active');
            document.getElementById('overlay').classList.add('show');
        };

        window.closeAllSidebars = () => {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('userSidebar').classList.remove('active');
            document.getElementById('overlay').classList.remove('show');
        };

        window.toggleCart = (show) => {
            document.getElementById('cartDrawer').classList.toggle('open', show);
            document.getElementById('overlay').classList.toggle('active', show);
        };

        window.closeAll = () => {
            closeAllSidebars();
            toggleCart(false);
            document.getElementById('checkoutModal').style.display = 'none';
        };

        window.updateCart = () => {
            localStorage.setItem('zorin_cart', JSON.stringify(cart));
            document.getElementById('cartBadge').innerText = cart.length;
            document.getElementById('cartCountSidebar').innerText = cart.length;
            const list = document.getElementById('cartItemsList');
            list.innerHTML = cart.map((item, index) => `
            <div class="cart-item">
                <img src="${item.image}">
                <div style="flex-grow:1">
                    <div style="font-size:14px; font-weight:bold;">${item.name}</div>
                    <small>${item.color} | ${item.size} | x${item.qty}</small><br>
                    <b>${item.price * item.qty} EGP</b>
                </div>
                <i class="fas fa-trash" onclick="removeItem(${index})" style="color:red; cursor:pointer;"></i>
            </div>`).join('');
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cartTotal').innerText = "الإجمالي: " + total + " EGP";
        };

        window.removeItem = (i) => { cart.splice(i, 1); window.updateCart(); };
        window.buyNow = () => {
            if (!selectedSize) return alert("الرجاء اختيار المقاس");
            tempItem = { id: productId, name: product.name, price: product.salePrice || product.price, color: selectedColor, size: selectedSize, image: product.image, qty: quantity };
            document.getElementById('checkoutModal').style.display = 'block';
            document.getElementById('overlay').classList.add('active');
        };
        window.openCheckout = () => { if (cart.length > 0) { tempItem = null; document.getElementById('checkoutModal').style.display = 'block'; toggleCart(false); } };
        window.closeCheckout = () => { document.getElementById('checkoutModal').style.display = 'none'; document.getElementById('overlay').classList.remove('active'); };
        window.handleUserIcon = () => currentUser ? toggleSidebar('userSidebar') : location.href = 'login.html';
        window.confirmLogout = () => confirm("Logout?") && signOut(auth).then(() => location.reload());
        window.toggleDarkMode = () => { document.body.classList.toggle('dark-mode'); localStorage.setItem('zorin_theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light'); };

        window.toggleAcc = (btn) => {
            const content = btn.nextElementSibling;
            const icon = btn.querySelector('i');
            if (content.style.maxHeight) {
                content.style.maxHeight = null;
                icon.classList.replace('fa-minus', 'fa-plus');
            } else {
                document.querySelectorAll('.acc-content').forEach(c => c.style.maxHeight = null);
                document.querySelectorAll('.acc-btn i').forEach(i => i.classList.replace('fa-minus', 'fa-plus'));
                content.style.maxHeight = content.scrollHeight + "px";
                icon.classList.replace('fa-plus', 'fa-minus');
            }
        };

        // دالة عرض التقييمات
        window.loadReviews = async () => {
            const list = document.getElementById('reviewsList');
            try {
                const q = query(collection(db, "reviews"), where("productId", "==", productId));
                const snap = await getDocs(q);
                if (snap.empty) {
                    list.innerHTML = `<p style="color: #999;">لا توجد تقييمات بعد.</p>`;
                    return;
                }
                let html = "";
                snap.forEach(d => {
                    const r = d.data();
                    html += `
                        <div style="border-bottom: 1px solid #eee; padding: 15px 0;">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <b style="font-size:14px;">${r.userName}</b>
                                <span style="color:#ffc107;">${'⭐'.repeat(r.rating)}</span>
                            </div>
                            <p style="margin:5px 0; font-size:13px; color:#555;">${r.comment}</p>
                            <small style="color:#bbb; font-size:10px;">${r.createdAt?.toDate().toLocaleDateString() || ''}</small>
                        </div>`;
                });
                list.innerHTML = html;
            } catch (e) { console.error("Error loading reviews:", e); }
        };

        // دالة إرسال التقييم الموحدة
        window.sendReview = async () => {
            const comm = document.getElementById('rateComm').value;
            const rating = document.getElementById('selectedRating').value;
            const visitorName = document.getElementById('visitorName').value;
            const btn = document.getElementById('btnRev');

            if (!comm) return alert("اكتب تعليقك الأول");

            let finalName = currentUser ? (currentUser.displayName || currentUser.email.split('@')[0]) : (visitorName || "عميل مجهول");

            btn.innerText = "جاري النشر..."; btn.disabled = true;

            try {
                await addDoc(collection(db, "reviews"), {
                    productId: productId,
                    userName: finalName,
                    comment: comm,
                    rating: parseInt(rating),
                    createdAt: new Date()
                });
                alert("شكراً لتقييمك يا " + finalName);
                location.reload(); 
            } catch (e) {
                alert("حدث خطأ أثناء النشر");
                btn.disabled = false;
                btn.innerText = "نشر التقييم";
            }
        };

        // نظام النجوم
        let selectedRating = 5;
        document.querySelectorAll('.star').forEach(star => {
            star.onclick = function() {
                selectedRating = this.dataset.value;
                document.getElementById('selectedRating').value = selectedRating;
                document.querySelectorAll('.star').forEach(s => {
                    s.style.color = (s.dataset.value <= selectedRating) ? '#ffc107' : '#ccc';
                });
            }
        });

        window.onload = () => {
            if (localStorage.getItem('zorin_theme') === 'dark') document.body.classList.add('dark-mode');
            loadProduct();
            window.updateCart();
        };
    </script>
</body>

</html>
